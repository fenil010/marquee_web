<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawing Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #c7d3c0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            gap: 20px;
        }

        #drawing-board {
            width: 75vw;
            height: 75vh;
            background: #e8f5e9;
            border: 2px solid gray;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .drawing {
            width: 10px;
            height: 10px;
            background: red;
            position: absolute;
            border-radius: 50%;
        }

        .controls {
            width: 75vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 15px 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: #ef5350;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #d32f2f;
        }

        input[type='range'] {
            width: 180px;
            cursor: pointer;
        }

        input[type='color'] {
            width: 40px;
            height: 40px;
            border: none;
            cursor: pointer;
            background: none;
        }
    </style>
</head>

<body>
    <div id="drawing-board"></div>
    <div class="theme">
        <button id="light-theme">Light Theme</button>
        <button id="dark-theme">Dark Theme</button>
        <button id="grey-theme">Grey Theme</button>
    </div>

    <div class="controls">
        <button id="clear-board">Clear</button>

        <div class="control-group">
            <strong>Brush Size</strong>
            <input type="range" id="slider" min="0" max="50" value="10" />
        </div>

        <div class="control-group">
            <label for="colorPicker"><strong>Color</strong></label>
            <input type="color" id="colorPicker" value="#ff0000" />
        </div>
    </div>
    <script>
        const board = document.getElementById("drawing-board");
        const clearButton = document.getElementById("clear-board");
        const brushSizeInput = document.getElementById("slider");
        const colorInput = document.getElementById("colorPicker");
        const lightThemeButton = document.getElementById("light-theme");
        const darkThemeButton = document.getElementById("dark-theme");
        const greyThemeButton = document.getElementById("grey-theme");

        let isDrawing = false;

        lightThemeButton.addEventListener("click", function () {
            document.body.style.backgroundColor = "#c7d3c0";
            board.style.backgroundColor = "#e8f5e9";
        });

        darkThemeButton.addEventListener("click", function () {
            document.body.style.backgroundColor = "#2c3e50";
            board.style.backgroundColor = "gray";
        });

        greyThemeButton.addEventListener("click", function () {
            document.body.style.backgroundColor = "#bdc3c7";
            board.style.backgroundColor = "gray";
            document.body.style.filter = "grayscale(100%)";

        });


        board.addEventListener("mousedown", function () {
            isDrawing = true;
        });

        board.addEventListener("mousemove", function (event) {
            if (isDrawing) {
                const size = brushSizeInput.value;
                const rect = board.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                const point = document.createElement("div");
                point.className = "drawing";
                point.style.width = size + "px";
                point.style.height = size + "px";
                point.style.left = x - size / 2 + "px";
                point.style.top = y - size / 2 + "px";
                point.style.backgroundColor = colorInput.value;

                board.appendChild(point);
            }
        });

        board.addEventListener("mouseup", function () {
            isDrawing = false;
        });

        clearButton.addEventListener("click", function () {
            board.innerHTML = "";
        });
    </script>
</body>

</html>
