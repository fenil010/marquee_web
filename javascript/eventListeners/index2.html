<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grandparent{
            width: 400px;
            height: 400px;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .parent{
            width: 300px;
            height: 300px;
            background-color: yellow;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .grandchild{
            width: 200px;
            height: 200px;
            background-color: green;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .parentchild{
            width: 100px;
            height: 100px;
            background-color: blueviolet;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .child{
            width: 50px;
            height: 50px;
            background-color: black;

        }
    </style>
</head>
<body>
    <div class="grandparent">
        <div class="parent">
            <div class="grandchild">
                <div class="parentchild">
                    <div class="child">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const grandparent = document.querySelector('.grandparent');
        const parent = document.querySelector('.parent');
        const grandchild = document.querySelector('.grandchild');
        const parentchild = document.querySelector('.parentchild');
        const child = document.querySelector('.child');

        grandparent.addEventListener('click', function() {
            console.log('Grandparent clicked!');
        },true);

        parent.addEventListener('click', function() {
            console.log('Parent clicked!');
        },true);

        grandchild.addEventListener('click', function() {
            console.log('Grandchild clicked!');
        },true);

        parentchild.addEventListener('click', function() {
            console.log('ParentChild clicked!');
        },true);

        child.addEventListener('click', function() {
            console.log('Child clicked!');
        },true);
    </script>
</body>
</html>
